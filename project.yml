# XcodeGen spec. Regenerate with `xcodegen generate` after editing.
name: Beeline

options:
  bundleIdPrefix: com.sidharthdutta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BeelineKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Beeline:
    type: application
    platform: iOS
    sources:
      - path: App/Beeline
    dependencies:
      - package: BeelineKit
        product: BeelineUI
    info:
      path: App/Beeline/Info.plist
      properties:
        CFBundleDisplayName: Beeline
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Beeline uses your location to give walking directions to buildings, rooms and bus stops on campus.
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7Z62JKF2LJ

schemes:
  Beeline:
    build:
      targets:
        Beeline: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: BeelineKit/BeelineCoreTests
